[flake8]
# Match black's line length so the two tools don't conflict.
max-line-length = 100

# E203: whitespace before ':' — black disagrees with flake8 here
# W503: line break before binary operator — superseded by W504, black prefers this style
extend-ignore = E203, W503

# Don't lint auto-generated files
exclude =
    src/lammps_mdi/_version.py,
    .git,
    __pycache__,
    build,
    dist,
    .eggs,

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True

# Heavy runtime dependencies that have no stubs and are not installed in CI.
# These are imported inside try/except or lazy functions, so ignoring them
# at the type-check level is correct.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-mdi.*]
ignore_missing_imports = True

[mypy-mdi]
ignore_missing_imports = True

[mypy-mace.*]
ignore_missing_imports = True

[mypy-vesin.*]
ignore_missing_imports = True

[mypy-cuequivariance.*]
ignore_missing_imports = True

[mypy-cuequivariance]
ignore_missing_imports = True

[mypy-mpi4py.*]
ignore_missing_imports = True

[mypy-matscipy.*]
ignore_missing_imports = True
